<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t">
  <title id="t">Nicolas Rodriguez Forero · AI Engineer</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00CFFF"/>
      <stop offset="1" stop-color="#00FF87"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#00FF87" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A2535" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="20"/></clipPath>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @keyframes swish { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
      @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
      .tail { transform-box: fill-box; transform-origin: 0% 98%; animation: swish 3.2s ease-in-out infinite; }
      .caret { animation: caret 1s steps(1) infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#050A0F"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <!-- Location pill -->
    <rect x="48" y="40" width="404" height="30" rx="15" fill="#0D1520" stroke="#1A2535"/>
    <circle class="dot" cx="66" cy="55" r="4" fill="#00FF87"/>
    <text class="sans" x="80" y="59.5" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#9FB0C3" textLength="356" lengthAdjust="spacingAndGlyphs">BOGOTÁ, COLOMBIA · OPEN TO NEW OPPORTUNITIES</text>

    <!-- Name -->
    <text class="sans" x="46" y="146" font-size="56" font-weight="800" fill="url(#g)" textLength="690" lengthAdjust="spacingAndGlyphs">Nicolas Rodriguez Forero</text>

    <!-- Headline -->
    <text class="sans" x="48" y="196" font-size="22" fill="#9FB0C3"><tspan fill="#FFFFFF" font-weight="700">AI Engineer</tspan><tspan fill="#00FF87"> · </tspan>Python · FastAPI · RAG · LangGraph</text>
    <text class="mono" x="48" y="232" font-size="15" fill="#5E6E80">Azure · MongoDB · PostgreSQL</text>
    <rect class="caret" x="288" y="219" width="9" height="17" fill="#00FF87"/>

    <!-- Cat -->
    <g transform="translate(752 62)" fill="#0D1520" stroke-linejoin="round" stroke-linecap="round" filter="url(#neon)">
      <path class="tail" d="M150 222 C192 224 204 182 188 152 C181 138 189 124 200 129" fill="none" stroke="#00CFFF" stroke-width="5"/>
      <path d="M62 116 C38 150 34 200 44 232 L156 232 C166 200 162 150 138 116 Z" stroke="#00FF87" stroke-width="3.5"/>
      <path d="M86 168 L83 222 M114 168 L117 222" fill="none" stroke="#00FF87" stroke-width="2.5" opacity="0.7"/>
      <ellipse cx="80" cy="226" rx="15" ry="7" stroke="#00FF87" stroke-width="3"/>
      <ellipse cx="120" cy="226" rx="15" ry="7" stroke="#00FF87" stroke-width="3"/>
      <path d="M45 85 C45 56 54 41 62 35 L58 5 L88 28 C96 26 104 26 112 28 L142 5 L138 35 C146 41 155 56 155 85 C155 115 130 130 100 130 C70 130 45 115 45 85 Z" stroke="#00FF87" stroke-width="3.5"/>
      <path d="M64 30 L63 15 L78 27 M136 30 L137 15 L122 27" fill="none" stroke="#00CFFF" stroke-width="2" opacity="0.8"/>
      <g class="eyes" stroke="none">
        <ellipse cx="78" cy="82" rx="8" ry="10" fill="#00FF87"/>
        <ellipse cx="122" cy="82" rx="8" ry="10" fill="#00FF87"/>
        <ellipse cx="78" cy="82" rx="2.2" ry="7" fill="#050A0F"/>
        <ellipse cx="122" cy="82" rx="2.2" ry="7" fill="#050A0F"/>
      </g>
      <path d="M95 98 L105 98 L100 104 Z" fill="#00CFFF" stroke="#00CFFF" stroke-width="1.5"/>
      <path d="M100 104 Q95 112 88 107 M100 104 Q105 112 112 107" fill="none" stroke="#00CFFF" stroke-width="2"/>
      <path d="M66 98 L36 92 M66 104 L36 108 M134 98 L164 92 M134 104 L164 108" fill="none" stroke="#2C4058" stroke-width="2"/>
    </g>

    <rect x="0.5" y="0.5" width="999" height="299" rx="20" fill="none" stroke="#1A2535"/>
  </g>
</svg>
